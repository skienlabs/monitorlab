# MonitorLab hub on the VM. Lives at ~/docker/apps/monitorlab/docker-compose.yml.
# The GitHub Actions workflow runs `docker compose pull && docker compose up -d` here.
# Settings come from .env next to this file (copy .env.example).
services:
  monitorlab:
    image: ${MONITORLAB_IMAGE:?set MONITORLAB_IMAGE in .env}
    container_name: monitorlab
    restart: unless-stopped
    # Host networking + PID namespace: the built-in agent sees the VM's real network
    # counters and processes. The hub listens on :8443 (MONITORLAB_LISTEN to change).
    network_mode: host
    pid: host
    env_file: .env
    environment:
      MONITORLAB_HOST_ROOT: /host
    volumes:
      - monitorlab-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  monitorlab-data:
