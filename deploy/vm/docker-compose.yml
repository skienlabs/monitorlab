# MonitorLab hub on the VM: ~/docker/apps/monitorlab/docker-compose.yml
# GitHub Actions runs `docker compose pull && docker compose up -d` here.
# Same layout as the other apps: on skiensuite-net, published through Nginx Proxy Manager.
#
# Nginx Proxy Manager → Proxy host:
#   Domain:        monitorlab.skienlab.com      (DNS A record → this VM)
#   Forward:       http   monitorlab   8090
#   Websockets Support: ON  (required for live logs, terminal and agents)
#   SSL:           Let's Encrypt, Force SSL, HTTP/2
networks:
  skiensuite-net:
    name: skiensuite-net
    external: true

services:
  monitorlab:
    image: us-central1-docker.pkg.dev/inspired-verve-293514/test-images/monitorlab:latest
    container_name: monitorlab
    restart: unless-stopped
    networks:
      - skiensuite-net
    environment:
      # TLS is terminated by Nginx Proxy Manager.
      MONITORLAB_TLS: "off"
      MONITORLAB_LISTEN: "0.0.0.0:8090"
      MONITORLAB_TRUST_PROXY: "true"
      MONITORLAB_SECURE_COOKIES: "true"
      # Address users, agents and alert emails use:
      MONITORLAB_PUBLIC_URL: "https://monitorlab.skienlab.com"
      # First start only. Leave MONITORLAB_ADMIN_PASSWORD unset to get a generated
      # password in `docker logs monitorlab` (must be changed at first sign-in).
      MONITORLAB_ADMIN_EMAIL: "admin@skienlab.com"
      # This container sits on a Docker network, so it cannot see the VM's real network
      # traffic. Monitor the VM itself by installing the agent on it (see README).
      MONITORLAB_LOCAL_AGENT: "false"
      TZ: "Asia/Kolkata"
    volumes:
      - monitorlab-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  monitorlab-data:
