[package]
name = "vigil-hub"
version.workspace = true
edition.workspace = true

[dependencies]
vigil-common = { path = "../common" }
vigil-agent = { path = "../agent" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
clap.workspace = true
rustls.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "set-header", "limit", "timeout"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
rcgen = "0.13"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
subtle = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
