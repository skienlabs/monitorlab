[package]
name = "monitorlab-agent"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "monitorlab-agent"
path = "src/main.rs"

[features]
default = ["mssql-query"]
# Optional live queries against SQL Server DMVs (needs a read-only login in agent.toml).
mssql-query = ["dep:tiberius", "dep:tokio-util"]

[dependencies]
monitorlab-common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
clap.workspace = true
rustls.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "0.26"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network", "user"] }
bollard = { version = "0.18", default-features = false, features = ["http", "pipe"] }
toml = "0.8"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots-no-provider"] }
roxmltree = "0.20"
tokio-postgres = "0.7"
portable-pty = "0.9"
tokio-postgres-rustls = "0.13"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winreg = "0.52"
